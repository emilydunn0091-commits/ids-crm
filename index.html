<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechVera IDs Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fb;--card:#fff;--tx:#1d1a3b;--mu:#7a7796;--bd:#e8e5f5;--pr:#5b3fe0;--pr2:#7c5cff;--ok:#12805c;--wa:#b7791f;--er:#c53030}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;box-shadow:0 4px 12px #5b3fe033}
.btn.s{background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.d{background:var(--er)}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.5}
input,select,textarea{border:1px solid var(--bd);border-radius:10px;padding:9px 12px;background:#fff;width:100%;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #7c5cff44;border-color:var(--pr2)}
label{display:block;font-weight:600;font-size:12px;color:var(--mu);margin:10px 0 4px}
.brand b{font-size:23px;letter-spacing:-.5px;color:#fff;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:2.5px;opacity:.7;font-weight:700}
#login{max-width:390px;margin:9vh auto;background:var(--card);padding:34px;border-radius:22px;box-shadow:0 24px 60px #3b2bb52e}
#login .brand{margin-bottom:14px}#login .brand b{color:var(--pr)}#login .brand small{color:var(--mu)}
#app{display:none;min-height:100vh}
#side{position:fixed;inset:0 auto 0 0;width:240px;background:linear-gradient(180deg,#4a33c9,#1f1458);color:#dcd7ff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:5;border-radius:0 26px 26px 0;box-shadow:6px 0 30px #3b2bb533}
#side .brand{margin:0 10px 22px}
#side a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;cursor:pointer;color:inherit;font-weight:600}
#side a i{font-style:normal;width:20px;text-align:center;font-size:16px}
#side a:hover{background:#ffffff1f}#side a.on{background:linear-gradient(135deg,#8b6bff,#5b3fe0);color:#fff;box-shadow:0 6px 16px #0003}
#side .me{padding:10px 14px;font-size:12px;opacity:.85;border-top:1px solid #ffffff22}
#main{margin-left:240px;padding:26px;max-width:1340px}
#menu{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
.hero{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:22px 28px;margin-bottom:16px;box-shadow:0 6px 24px #5b3fe012}
.hero small{color:var(--mu);letter-spacing:2px;font-size:11px;font-weight:700}.hero h2{margin:4px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.8px}.hero p{margin:0;color:var(--mu)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;box-shadow:0 6px 20px #5b3fe010;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-18px;top:-18px;width:72px;height:72px;border-radius:50%;background:#7c5cff14}
.card b{display:block;font-size:28px;font-weight:800;letter-spacing:-1px}.card span{color:var(--mu);font-size:12px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px #5b3fe00d}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{width:auto;min-width:130px;flex:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);cursor:pointer;user-select:none;background:#faf9ff}
tr:hover td{background:#fbfaff}td input,td select{min-width:120px}
h3{font-size:16px;font-weight:800;margin:20px 0 10px}
.tag{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700}
.Pending{background:#fdecec;color:var(--er)}.In-Progress{background:#fef3dc;color:var(--wa)}.Completed{background:#dff5ec;color:var(--ok)}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.empty{padding:34px;text-align:center;color:var(--mu)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:20}
.toast{background:#1d1a3b;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 6px 18px #0004}.toast.e{background:var(--er)}.toast.o{background:var(--ok)}
#modal{position:fixed;inset:0;background:#1d1a3b99;display:none;align-items:center;justify-content:center;z-index:15;padding:14px}
#modal>div{background:#fff;border-radius:20px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){#side{transform:translateX(-100%);transition:.2s}#side.open{transform:none}#main{margin-left:0;padding:14px}#menu{display:inline-block}.g2{grid-template-columns:1fr}.hero h2{font-size:22px}}
</style></head><body>
<div id="login"><div class="brand"><b>TechVera</b><small>IDS PORTAL</small></div>
<label>Email</label><input id="em" type="email" autocomplete="username">
<label>Password</label><input id="pw" type="password" autocomplete="current-password">
<p id="lerr" style="color:var(--er);min-height:18px"></p><button class="btn" id="lbtn" style="width:100%">Sign in</button></div>
<div id="app"><nav id="side"></nav><main id="main"></main></div>
<div id="modal"><div id="mbody"></div></div><div id="toasts"></div>
<script>
const C=window.APP_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const R=['Wrong Pass','Suspend','Suspend Working','Name Issue','Email','Other'];
let me=null,files=[],view='dash',S={page:1,sort:'created_at',dir:-1,q:'',from:'',to:'',tl:'',st:''},RP={from:'',to:'',tl:''},RC=[],RF={q:'',reason:'',tl:'',from:'',to:''};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=d=>new Date(d).toLocaleDateString('en-CA'),today=()=>ld(new Date()),fmt=d=>d?new Date(d).toLocaleString():'-',isA=()=>me.role==='admin';
const rtxt=r=>r.reason==='Other'?'Other: '+(r.reason_other||''):(r.reason||(r.last_updated?'OK':''));
function toast(m,t='n'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),4000)}
function modal(h){$('#mbody').innerHTML=h;$('#modal').style.display='flex'}function closeM(){$('#modal').style.display='none'}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
function ask(o){return new Promise(res=>{const inp=o.input!==undefined;
 modal(`<h3 style="margin:0 0 8px;font-size:18px">${esc(o.title)}</h3><p style="color:var(--mu);margin:0 0 ${inp?10:20}px">${esc(o.msg||'')}</p>${inp?`<input id="askin" value="${esc(o.input)}" style="margin-bottom:20px">`:''}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" id="ask-no">Cancel</button><button class="btn ${o.danger?'d':''}" id="ask-ok">${esc(o.ok||'OK')}</button></div>`);
 const done=v=>{$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};closeM();res(v)};
 $('#ask-no').onclick=()=>done(null);$('#ask-ok').onclick=()=>done(inp?$('#askin').value:true);
 $('#modal').onclick=e=>{if(e.target.id==='modal')done(null)};
 if(inp){const i=$('#askin');i.focus();i.onkeydown=e=>{if(e.key==='Enter')$('#ask-ok').click()}}})}
async function copy(t,l='Copied'){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast(l,'o')}
async function csv(rows,name){if(!rows.length)return toast('Nothing to export','e');if(!(await ask({title:'Export sensitive data?',msg:'This export contains plain-text UIDs and passwords. Store the file securely.',ok:'Export'})))return;
 const H=['File Name','Team Lead','Assignment Date','Person Number','UID','Password','Reason','Response','Last Updated'];
 const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const b=new Blob(['\ufeff'+[H,...rows.map(r=>[r.file,r.tl,r.date,r.person,r.uid,r.password,r.reason,r.remarks,r.last])].map(l=>l.map(q).join(',')).join('\r\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'-'+today()+'.csv';a.click();toast('Exported '+rows.length+' rows','o')}
// ---- auth
$('#lbtn').onclick=async()=>{$('#lerr').textContent='';$('#lbtn').disabled=true;const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});$('#lbtn').disabled=false;if(error)return $('#lerr').textContent=error.message;boot()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lbtn').click()};
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return;
 const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(error||!data||!data.active){await sb.auth.signOut();$('#lerr').textContent='Account not found or deactivated.';return}
 me=data;$('#login').style.display='none';$('#app').style.display='block';nav();go('dash')}
const IC={dash:'⌂',files:'☰',add:'＋',daily:'◷',reports:'◐',profile:'☺',tls:'☻',records:'▤'};
function nav(){const t=isA()?[['dash','Dashboard'],['files','All Files'],['tls','Team Leads'],['records','ID Records'],['reports','Daily & Monthly Reports'],['profile','Settings']]:
 [['dash','Dashboard'],['files','My Files'],['add','Add New File'],['daily','Daily Updates'],['reports','Reports'],['profile','Profile']];
 $('#side').innerHTML=`<div class="brand"><b>TechVera</b><small>IDS PORTAL</small></div>`+t.map(([k,l])=>`<a data-k="${k}" onclick="go('${k}')"><i>${IC[k]}</i>${l}</a>`).join('')+`<div style="flex:1"></div><div class="me">${esc(me.full_name||me.email)}<br>${isA()?'Admin':'Team Lead'}</div><a onclick="logout()"><i>↩</i>Sign out</a>`}
async function fetchFiles(){const{data,error}=await sb.from('files').select('*,tl:profiles!files_team_lead_id_fkey(full_name,email),id_records(id,reason,last_updated)').eq('archived',false).order('created_at',{ascending:false});
 if(error){toast(error.message,'e');return false}
 files=data.map(f=>{const r=f.id_records||[];f.total=r.length;f.upd=r.filter(x=>x.last_updated).length;f.pend=f.total-f.upd;f.last=r.reduce((m,x)=>x.last_updated&&x.last_updated>m?x.last_updated:m,'');
  f.today=r.some(x=>x.last_updated&&ld(x.last_updated)===today());f.st=f.upd===0?'Pending':f.pend===0?'Completed':'In-Progress';f.tlname=f.tl?.full_name||f.tl?.email||'-';return f});return true}
async function go(v,arg){view=v;curTL=null;document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.k===v));$('#side').classList.remove('open');
 const m=$('#main');m.innerHTML='<div class="empty">Loading…</div>';
 if(v==='profile')return pProfile();if(v==='add'){await fetchFiles();return pAdd()}
 if(v==='records')return pRecords();
 if(!(await fetchFiles()))return m.innerHTML='<div class="empty">Could not load data.</div>';
 ({dash:pDash,files:()=>pFiles('files'),daily:()=>pFiles('daily'),reports:pReports,tls:pTLs})[v]()}
const hdr=(t,x='')=>`<div class="top"><div><button class="btn s" id="menu" onclick="$('#side').classList.toggle('open')">☰</button> <h1 style="display:inline">${t}</h1></div><div>${x}</div></div>`;
// ---- dashboard
async function pDash(){const T=today(),act=files,rs=act.flatMap(f=>f.id_records);let c;const hh=new Date().getHours(),hero=`<div class="hero"><small>WORKSPACE OVERVIEW</small><h2>${hh<12?'Good morning':hh<18?'Good afternoon':'Good evening'}, ${esc(me.full_name||me.email.split('@')[0])} 👋</h2><p>${isA()?'Everything across all Team Leads at a glance.':'Your files and daily updates at a glance.'}</p></div>`;
 const by={};R.forEach(r=>by[r]=0);let none=0,ok=0;rs.forEach(r=>r.reason?by[r.reason]=(by[r.reason]||0)+1:r.last_updated?ok++:none++);
 if(isA()){const{data}=await sb.from('profiles').select('id').eq('role','team_lead');
  c=[[data?.length||0,'Total Team Leads'],[act.length,'Total Files'],[rs.length,'Total IDs'],[act.filter(f=>f.assignment_date===T).length,'Files Received Today'],[act.filter(f=>f.st!=='Completed').length,'Files Pending Updates'],[act.filter(f=>f.st==='Completed').length,'Files Completed']]}
 else c=[[act.length,'Total Files'],[rs.length,'Total IDs Assigned'],[act.filter(f=>!f.today).length,'Files Pending Update Today'],[act.filter(f=>f.today).length,'Files Updated Today']];
 let ex='';if(isA()){const d={};act.forEach(f=>d[f.assignment_date]=(d[f.assignment_date]||0)+1);
  ex=`<div class="panel"><b>Files received per day (latest 7)</b><div class="tw"><table><tr><th>Date</th><th>Files</th></tr>${Object.entries(d).sort().reverse().slice(0,7).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan=2>No data</td></tr>'}</table></div></div>`}
 $('#main').innerHTML=hdr('Dashboard',isA()?'':'<button class="btn" onclick="go(\'add\')">+ Add New File</button>')+
 `${hero}<div class="cards">${c.map(([n,l])=>`<div class="card"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
 <div class="panel"><b>IDs by status</b><div class="cards" style="margin:10px 0 0">${Object.entries(by).map(([k,v])=>`<div class="card"><b>${v}</b><span>${k}</span></div>`).join('')}<div class="card"><b>${ok}</b><span>OK (no issue)</span></div><div class="card"><b>${none}</b><span>Not updated yet</span></div></div></div>${ex}
 <h3>Recently updated files</h3><div class="panel"><div class="tw">${ftable([...act].filter(f=>f.last).sort((a,b)=>b.last.localeCompare(a.last)).slice(0,5))}</div></div>`}
// ---- files
function ftable(list){if(!list.length)return'<div class="empty">No files found.</div>';
 const th=(k,l)=>`<th onclick="sortBy('${k}')">${l}${S.sort===k?(S.dir>0?' ▲':' ▼'):''}</th>`;
 return`<table><tr>${th('file_name','File')}${isA()?th('tlname','Team Lead'):''}${th('received_from','Received From')}${th('assigned_to','Assigned To')}${th('assignment_date','Date')}${th('total','Total')}${th('upd','Updated')}${th('pend','Pending')}${th('last','Last Updated')}<th>Status</th><th>Actions</th></tr>`+
 list.map(f=>`<tr><td>${esc(f.file_name)}</td>${isA()?`<td>${esc(f.tlname)}</td>`:''}<td>${esc(f.received_from)}</td><td>${esc(f.assigned_to)}</td><td>${f.assignment_date}</td><td>${f.total}</td><td>${f.upd}</td><td>${f.pend}</td><td>${fmt(f.last)}</td><td><span class="tag ${f.st}">${f.st.replace('-',' ')}</span></td>
 <td><button class="btn s sm" onclick="openFile('${f.id}',false)">Open File</button> <button class="btn sm" onclick="openFile('${f.id}',true)">Update IDs</button> <button class="btn d sm" onclick="delFile('${f.id}')">Delete</button></td></tr>`).join('')+'</table>'}
function sortBy(k){S.dir=S.sort===k?-S.dir:1;S.sort=k;draw()}
function setS(k,v){S[k]=v;S.page=1;draw()}
let daily=false;
function pFiles(mode){daily=mode==='daily';const tls=[...new Set(files.map(f=>f.tlname))].sort();
 $('#main').innerHTML=hdr(daily?'Daily Updates':isA()?'All Files':'My Files',isA()?'':'<button class="btn" onclick="go(\'add\')">+ Add New File</button>')+
 `<div class="panel"><div class="bar"><input placeholder="Search file, sender, assignee…" value="${esc(S.q)}" oninput="clearTimeout(window._t);window._t=setTimeout(()=>setS('q',this.value),250)">
 ${isA()?`<select onchange="setS('tl',this.value)"><option value="">All Team Leads</option>${tls.map(t=>`<option ${S.tl===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`:''}
 <select onchange="setS('st',this.value)"><option value="">All statuses</option>${['Pending','In-Progress','Completed'].map(s=>`<option value="${s}" ${S.st===s?'selected':''}>${s.replace('-',' ')}</option>`).join('')}</select>
 <input type="date" value="${S.from}" onchange="setS('from',this.value)" title="From"><input type="date" value="${S.to}" onchange="setS('to',this.value)" title="To">
 <button class="btn s" onclick="S={...S,q:'',tl:'',st:'',from:'',to:'',page:1};pFiles('${mode}')">Reset</button></div>
 ${daily?'<p style="color:var(--mu);margin:0 0 8px">Files not yet updated today.</p>':''}<div class="tw" id="tbl"></div><div class="pg" id="pg"></div></div>`;draw()}
function draw(){if(!$('#tbl'))return;const q=S.q.toLowerCase();
 let l=files.filter(f=>(!q||[f.file_name,f.received_from,f.assigned_to].some(x=>x.toLowerCase().includes(q)))&&(!S.tl||f.tlname===S.tl)&&(!S.st||f.st===S.st)&&(!S.from||f.assignment_date>=S.from)&&(!S.to||f.assignment_date<=S.to)&&(!daily||!f.today));
 l.sort((a,b)=>{const x=a[S.sort]??'',y=b[S.sort]??'';return(x>y?1:x<y?-1:0)*S.dir});
 const n=Math.max(1,Math.ceil(l.length/10));S.page=Math.min(S.page,n);$('#tbl').innerHTML=ftable(l.slice((S.page-1)*10,S.page*10));
 $('#pg').innerHTML=`<span>${l.length} files</span><button class="btn s sm" ${S.page<2?'disabled':''} onclick="S.page--;draw()">Prev</button> ${S.page}/${n} <button class="btn s sm" ${S.page>=n?'disabled':''} onclick="S.page++;draw()">Next</button>`}
async function delFile(id){const f=files.find(x=>x.id===id);if(!f)return;
 if(!(await ask({title:'Delete file?',msg:`"${f.file_name}" and all ${f.total} IDs with their update history will be permanently deleted. This cannot be undone.`,ok:'Delete',danger:true})))return;
 
 const{data,error}=await sb.from('files').delete().eq('id',id).select('id');
 if(error||!data?.length)return toast(error?.message||'Not permitted','e');toast('File deleted','o');curTL?tlFiles(curTL):go(view)}
async function archive(id){if(!confirm('Archive this file? It will be hidden from lists (data is kept).'))return;
 const{data,error}=await sb.from('files').update({archived:true}).eq('id',id).select();if(error||!data?.length)return toast(error?.message||'Not permitted','e');toast('File archived','o');go(view)}
// ---- add file
function pAdd(){$('#main').innerHTML=hdr('Add New File')+`<div class="panel" style="max-width:640px"><div class="g2"><div><label>File Name *</label><input id="a1"></div><div><label>Received From *</label><input id="a2"></div>
 <div><label>Assigned To *</label><input id="a3"></div><div><label>Assignment Date *</label><input id="a4" type="date" value="${today()}"></div><div><label>Total Number of IDs *</label><input id="a5" type="number" min="1" max="500"></div></div>
 <label>Notes (optional)</label><textarea id="a6" rows="3"></textarea><p><button class="btn" id="asave" onclick="addFile()">Create File</button></p></div>`}
async function addFile(){const v=i=>$('#a'+i).value.trim(),n=parseInt(v(5),10);
 if(!v(1)||!v(2)||!v(3)||!v(4))return toast('Fill in all required fields','e');if(!(n>=1&&n<=500))return toast('Total IDs must be between 1 and 500','e');
 $('#asave').disabled=true;const{data,error}=await sb.rpc('create_file_with_records',{p_name:v(1),p_from:v(2),p_to:v(3),p_date:v(4),p_total:n,p_notes:v(6)||null});$('#asave').disabled=false;
 if(error)return toast(error.message,'e');toast(`File created with ${n} ID entries`,'o');openFile(data,true)}
// ---- file view / update
async function openFile(id,edit){view='file';const m=$('#main');m.innerHTML='<div class="empty">Loading…</div>';
 const[a,b]=await Promise.all([sb.from('files').select('*,tl:profiles!files_team_lead_id_fkey(full_name,email)').eq('id',id).single(),sb.from('id_records').select('*').eq('file_id',id).order('person_number')]);
 if(a.error||b.error)return m.innerHTML=`<div class="empty">${esc((a.error||b.error).message)}</div>`;
 const f=a.data,rs=b.data,tl=f.tl?.full_name||f.tl?.email||'-',dis=edit?'':'disabled';window._rs=rs;window._f=f;window._tl=tl;
 m.innerHTML=hdr(esc(f.file_name),`<button class="btn s" onclick="curTL?tlFiles(curTL):go('files')">← Back</button> ${edit?'':`<button class="btn" onclick="openFile('${id}',true)">Update IDs</button>`}`)+
 `<div class="panel">Team Lead: <b>${esc(tl)}</b> · Received from: <b>${esc(f.received_from)}</b> · Assigned to: <b>${esc(f.assigned_to)}</b> · Date: <b>${f.assignment_date}</b> · IDs: <b>${rs.length}</b>${f.notes?`<br><span style="color:var(--mu)">${esc(f.notes)}</span>`:''}
 <div style="margin-top:10px"><button class="btn s sm" onclick="copyAll()">Copy all (Excel)</button> <button class="btn s sm" onclick="csv(fileRows(),'file')">Export CSV</button></div></div>
 <div class="panel"><div class="tw"><table><tr><th>Person</th><th>UID / ID</th><th>Password</th><th>Reason / Status</th><th>Response</th><th>Last Updated</th><th>Copy</th></tr>`+
 rs.map(r=>`<tr data-id="${r.id}"><td>Person ${r.person_number}</td><td><input class="u" value="${esc(r.uid)}" ${dis}></td><td><input class="p" value="${esc(r.password)}" ${dis}></td>
 <td><select class="r" ${dis} onchange="this.nextElementSibling.style.display=this.value==='Other'?'block':'none'"><option value="">— ID OK</option>${(!r.reason||R.includes(r.reason)?R:[...R,r.reason]).map(x=>`<option ${r.reason===x?'selected':''}>${x}</option>`).join('')}</select>
 <input class="o" placeholder="Write your own remark…" value="${esc(r.reason_other)}" ${dis} style="display:${r.reason==='Other'?'block':'none'};margin-top:4px"></td>
 <td><input class="m" value="${esc(r.remarks)}" ${dis}></td><td>${fmt(r.last_updated)}</td>
 <td><button class="btn s sm" onclick="cp('${r.id}','uid')">UID</button> <button class="btn s sm" onclick="cp('${r.id}','password')">Pass</button> <button class="btn s sm" onclick="cp('${r.id}','rec')">Record</button> <button class="btn s sm" onclick="hist('${r.id}')">History</button></td></tr>`).join('')+
 `</table></div>${edit?`<p><button class="btn" id="ssave" onclick="saveRows('${id}')">Save Updates</button></p>`:''}</div>`}
const line=r=>[`Person ${r.person_number}`,r.uid||'',r.password||'',rtxt(r),r.remarks||''].map(x=>String(x).replace(/[\t\r\n]+/g,' ')).join('\t');
function cp(id,k){const r=_rs.find(x=>x.id===id),row=document.querySelector(`tr[data-id="${id}"]`);
 const cur={...r,uid:row.querySelector('.u').value,password:row.querySelector('.p').value};
 if(k==='rec')return copy(line(cur),'Record copied');copy(cur[k]||'',k==='uid'?'UID copied':'Password copied')}
function copyAll(){copy(['Person\tUID\tPassword\tReason\tRemarks',..._rs.map(line)].join('\n'),'All records copied')}
const fileRows=()=>_rs.map(r=>({file:_f.file_name,tl:_tl,date:_f.assignment_date,person:r.person_number,uid:r.uid,password:r.password,reason:rtxt(r),remarks:r.remarks,last:fmt(r.last_updated)}));
async function saveRows(fid){const ch=[];
 for(const tr of document.querySelectorAll('tr[data-id]')){const o=_rs.find(x=>x.id===tr.dataset.id),n={uid:tr.querySelector('.u').value.trim()||null,password:tr.querySelector('.p').value||null,reason:tr.querySelector('.r').value||null,reason_other:null,remarks:tr.querySelector('.m').value.trim()||null};
  if(n.reason==='Other'){n.reason_other=tr.querySelector('.o').value.trim();if(!n.reason_other)return toast(`Person ${o.person_number}: enter the custom reason`,'e')}
  if(n.uid!==(o.uid||null)||n.password!==(o.password||null)||n.reason!==(o.reason||null)||n.reason_other!==(o.reason_other||null)||n.remarks!==(o.remarks||null))ch.push({id:o.id,n,p:o.person_number})}
 if(!ch.length)return toast('No changes to save');$('#ssave').disabled=true;
 const res=await Promise.all(ch.map(c=>sb.from('id_records').update(c.n).eq('id',c.id).select('id')));$('#ssave').disabled=false;
 const bad=res.map((r,i)=>r.error||!r.data?.length?ch[i].p:null).filter(Boolean);
 if(bad.length)toast(`Save failed for Person ${bad.join(', ')}. Other changes may have saved; reload to check.`,'e');else toast(`Saved ${ch.length} update(s)`,'o');
 openFile(fid,true)}
async function hist(id){const{data,error}=await sb.from('id_update_history').select('*,u:profiles(full_name,email)').eq('id_record_id',id).order('updated_at',{ascending:false});
 if(error)return toast(error.message,'e');
 modal(`<h3 style="margin-top:0">Update history</h3>${data.length?data.map(h=>`<div class="panel"><b>${fmt(h.updated_at)}</b> by ${esc(h.u?.full_name||h.u?.email||'?')}<br><small>Before:</small> ${esc(JSON.stringify(h.previous_values))}<br><small>After:</small> ${esc(JSON.stringify(h.new_values))}</div>`).join(''):'<div class="empty">No updates yet.</div>'}<button class="btn s" onclick="closeM()">Close</button>`)}
// ---- records (both roles, RLS-limited)
async function pRecords(){const m=$('#main');let all=[],from=0;
 for(;;){const{data,error}=await sb.from('id_records').select('*,f:files!inner(file_name,assignment_date,archived,tl:profiles!files_team_lead_id_fkey(full_name,email))').eq('f.archived',false).order('file_id').order('person_number').range(from,from+999);
  if(error)return m.innerHTML=`<div class="empty">${esc(error.message)}</div>`;all=all.concat(data);if(data.length<1000)break;from+=1000}
 RC=all.map(r=>({file:r.f.file_name,tl:r.f.tl?.full_name||r.f.tl?.email||'-',date:r.f.assignment_date,person:r.person_number,uid:r.uid||'',password:r.password||'',reason:rtxt(r),rk:r.reason||'',remarks:r.remarks||'',last:fmt(r.last_updated),ld:r.last_updated}));
 const tls=[...new Set(RC.map(r=>r.tl))].sort();
 m.innerHTML=hdr('ID Records','<button class="btn s" onclick="csv(RV(),\'records\')">Export filtered CSV</button>')+`<div class="panel"><div class="bar"><input placeholder="Search file name or UID" oninput="RF.q=this.value;rdraw()">
 ${isA()?`<select onchange="RF.tl=this.value;rdraw()"><option value="">All Team Leads</option>${tls.map(t=>`<option>${esc(t)}</option>`).join('')}</select>`:''}
 <select onchange="RF.reason=this.value;rdraw()"><option value="">All reasons</option><option value="_ok">OK (no issue)</option><option value="_none">Not updated</option>${R.map(x=>`<option>${x}</option>`).join('')}</select>
 <input type="date" onchange="RF.from=this.value;rdraw()"><input type="date" onchange="RF.to=this.value;rdraw()"></div><div class="tw" id="rt"></div></div>`;RF={q:'',reason:'',tl:'',from:'',to:''};rdraw()}
const RV=()=>{const q=RF.q.toLowerCase();return RC.filter(r=>(!q||r.file.toLowerCase().includes(q)||r.uid.toLowerCase().includes(q))&&(!RF.tl||r.tl===RF.tl)&&(!RF.reason||(RF.reason==='_none'?!r.ld:RF.reason==='_ok'?(r.ld&&!r.rk):r.rk===RF.reason))&&(!RF.from||r.date>=RF.from)&&(!RF.to||r.date<=RF.to))};
function rdraw(){const l=RV(),s=l.slice(0,300);$('#rt').innerHTML=l.length?`<table><tr><th>File</th>${isA()?'<th>Team Lead</th>':''}<th>Date</th><th>Person</th><th>UID</th><th>Password</th><th>Reason</th><th>Response</th><th>Last Updated</th><th>Copy</th></tr>${s.map((r,i)=>`<tr><td>${esc(r.file)}</td>${isA()?`<td>${esc(r.tl)}</td>`:''}<td>${r.date}</td><td>${r.person}</td><td>${esc(r.uid)}</td><td>${esc(r.password)}</td><td>${esc(r.reason)}</td><td>${esc(r.remarks)}</td><td>${r.last}</td>
 <td><button class="btn s sm" onclick="copy(RV()[${i}].uid,'UID copied')">UID</button> <button class="btn s sm" onclick="copy(RV()[${i}].password,'Password copied')">Pass</button></td></tr>`).join('')}</table>${l.length>300?`<p style="color:var(--mu)">Showing first 300 of ${l.length}. Use filters or export.</p>`:`<p style="color:var(--mu)">${l.length} records</p>`}`:'<div class="empty">No records match.</div>'}
// ---- reports
function pReports(){const tls=[...new Set(files.map(f=>f.tlname))].sort();
 $('#main').innerHTML=hdr(isA()?'Daily & Monthly Reports':'Reports')+`<div class="panel"><div class="bar">${isA()?`<select onchange="RP.tl=this.value;rep()"><option value="">All Team Leads</option>${tls.map(t=>`<option ${RP.tl===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`:''}
 <input type="date" value="${RP.from}" onchange="RP.from=this.value;rep()"><input type="date" value="${RP.to}" onchange="RP.to=this.value;rep()"></div></div><div id="rep"></div>`;rep()}
function rep(){const fl=files.filter(f=>(!RP.tl||f.tlname===RP.tl)&&(!RP.from||f.assignment_date>=RP.from)&&(!RP.to||f.assignment_date<=RP.to));
 const tb=(h,rows)=>`<div class="panel tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">No data</td></tr>`}</table></div>`;
 const grp=(arr,kf)=>{const o={};arr.forEach(x=>{const k=kf(x);(o[k]=o[k]||[]).push(x)});return Object.entries(o).sort().reverse()};
 const recs=fl.flatMap(f=>f.id_records),upd=recs.filter(r=>r.last_updated&&(!RP.from||ld(r.last_updated)>=RP.from)&&(!RP.to||ld(r.last_updated)<=RP.to));
 const by={};R.forEach(r=>by[r]=0);recs.forEach(r=>r.reason&&(by[r.reason]=(by[r.reason]||0)+1));by['OK (no issue)']=recs.filter(r=>r.last_updated&&!r.reason).length;
 $('#rep').innerHTML=`<div class="cards"><div class="card"><b>${fl.length}</b><span>Files</span></div><div class="card"><b>${recs.length}</b><span>IDs</span></div><div class="card"><b>${recs.filter(r=>r.last_updated).length}</b><span>IDs updated</span></div><div class="card"><b>${recs.filter(r=>!r.last_updated).length}</b><span>IDs pending</span></div></div>
 <h3>Files assigned per date</h3>${tb(['Date','Files','IDs'],grp(fl,f=>f.assignment_date).map(([k,v])=>[k,v.length,v.reduce((s,f)=>s+f.total,0)]))}
 <h3>IDs by Team Lead</h3>${tb(['Team Lead','Files','IDs','Updated','Pending'],grp(fl,f=>f.tlname).reverse().map(([k,v])=>[k,v.length,v.reduce((s,f)=>s+f.total,0),v.reduce((s,f)=>s+f.upd,0),v.reduce((s,f)=>s+f.pend,0)]))}
 <h3>Reason breakdown</h3>${tb(['Reason','IDs'],Object.entries(by))}
 <h3>Daily activity (IDs updated)</h3>${tb(['Date','IDs updated'],grp(upd,r=>ld(r.last_updated)).map(([k,v])=>[k,v.length]))}
 <h3>Monthly summary</h3>${tb(['Month','Files assigned','IDs assigned','IDs updated'],[...new Set([...fl.map(f=>f.assignment_date.slice(0,7)),...upd.map(r=>ld(r.last_updated).slice(0,7))])].sort().reverse().map(k=>[k,fl.filter(f=>f.assignment_date.startsWith(k)).length,fl.filter(f=>f.assignment_date.startsWith(k)).reduce((s,f)=>s+f.total,0),upd.filter(r=>ld(r.last_updated).startsWith(k)).length]))}`}
// ---- team leads / profile
let TLP=[],curTL=null;
async function pTLs(){const{data,error}=await sb.from('profiles').select('*').order('created_at');if(error)return toast(error.message,'e');
 $('#main').innerHTML=(TLP=data,hdr('Team Leads'))+`<div class="panel tw"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Files</th><th>IDs</th><th>Active</th><th></th></tr>${data.map(p=>{const fl=files.filter(f=>f.team_lead_id===p.id);
 return`<tr style="cursor:pointer" onclick="tlFiles('${p.id}')"><td>${esc(p.full_name)||'-'}</td><td>${esc(p.email)}</td><td>${p.role}</td><td>${fl.length}</td><td>${fl.reduce((s,f)=>s+f.total,0)}</td><td>${p.active?'Yes':'No'}</td><td><button class="btn sm" onclick="event.stopPropagation();tlFiles('${p.id}')">View Files</button> ${p.id===me.id?'':`<button class="btn s sm" onclick="event.stopPropagation();setActive('${p.id}',${!p.active})">${p.active?'Deactivate':'Activate'}</button> <button class="btn s sm" onclick="event.stopPropagation();rename('${p.id}','${esc(p.full_name).replace(/'/g,'')}')">Rename</button>`}</td></tr>`}).join('')}</table></div>
 <p style="color:var(--mu)">Click a Team Lead to see their files. New Team Leads are created in Supabase Authentication > Users (see README), then appear here.</p>`}
async function tlFiles(id){const p=TLP.find(x=>x.id===id);if(!p)return;const nm=p.full_name||p.email;curTL=id;view='files';
 document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.k==='tls'));$('#main').innerHTML='<div class="empty">Loading…</div>';
 if(!(await fetchFiles()))return;S={...S,q:'',st:'',from:'',to:'',tl:nm,page:1};pFiles('files');
 $('.top h1').textContent='Files of '+nm;$('.top>div:last-child').innerHTML='<button class="btn s" onclick="go(\'tls\')">← Team Leads</button>'}
async function setActive(id,v){if(!(await ask({title:v?'Activate user?':'Deactivate user?',msg:v?'They will be able to log in again.':'They will lose access immediately.',ok:v?'Activate':'Deactivate',danger:!v})))return;const{data,error}=await sb.from('profiles').update({active:v}).eq('id',id).select();if(error||!data?.length)return toast(error?.message||'Failed','e');toast('Updated','o');pTLs()}
async function rename(id,n){const v=await ask({title:'Rename Team Lead',msg:'Full name',input:n,ok:'Save'});if(v===null)return;const{data,error}=await sb.from('profiles').update({full_name:v.trim()}).eq('id',id).select();if(error||!data?.length)return toast(error?.message||'Failed','e');toast('Updated','o');pTLs()}
function pProfile(){$('#main').innerHTML=hdr(isA()?'Settings':'Profile')+`<div class="panel" style="max-width:420px"><p><b>${esc(me.full_name||'-')}</b><br>${esc(me.email)}<br>Role: ${isA()?'Admin':'Team Lead'}</p>
 <label>New password</label><input id="np" type="password" autocomplete="new-password"><p><button class="btn" onclick="chpw()">Change password</button></p></div>`}
async function chpw(){const p=$('#np').value;if(p.length<8)return toast('Use at least 8 characters','e');const{error}=await sb.auth.updateUser({password:p});if(error)return toast(error.message,'e');$('#np').value='';toast('Password changed','o')}
boot();
</script></body></html>
