<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechVera IDs Portal</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fb;--card:#fff;--tx:#1d1a3b;--mu:#7a7796;--bd:#e8e5f5;--pr:#5b3fe0;--pr2:#7c5cff;--ok:#12805c;--wa:#b7791f;--er:#c53030}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;box-shadow:0 4px 12px #5b3fe033}
.btn.s{background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.d{background:var(--er)}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.5}
input,select,textarea{border:1px solid var(--bd);border-radius:10px;padding:9px 12px;background:#fff;width:100%;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #7c5cff44;border-color:var(--pr2)}
label{display:block;font-weight:600;font-size:12px;color:var(--mu);margin:10px 0 4px}
.brand b{font-size:23px;letter-spacing:-.5px;color:#fff;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:2.5px;opacity:.7;font-weight:700}
#login{max-width:390px;margin:9vh auto;background:var(--card);padding:34px;border-radius:22px;box-shadow:0 24px 60px #3b2bb52e}
#login .brand{margin-bottom:14px}#login .brand b{color:var(--pr)}#login .brand small{color:var(--mu)}
#swm{text-align:center;margin:14px 0 0;color:var(--mu)}#swm a{color:var(--pr);font-weight:700;text-decoration:none}
#app{display:none;min-height:100vh}
#side{position:fixed;inset:0 auto 0 0;width:240px;background:linear-gradient(180deg,#4a33c9,#1f1458);color:#dcd7ff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:5;border-radius:0 26px 26px 0;box-shadow:6px 0 30px #3b2bb533}
#side .brand{margin:0 10px 22px}
#side a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;cursor:pointer;color:inherit;font-weight:600}
#side a i{font-style:normal;width:20px;text-align:center;font-size:16px}
#side a:hover{background:#ffffff1f}#side a.on{background:linear-gradient(135deg,#8b6bff,#5b3fe0);color:#fff;box-shadow:0 6px 16px #0003}
#side .me{padding:10px 14px;font-size:12px;opacity:.85;border-top:1px solid #ffffff22}
#main{margin-left:240px;padding:26px;max-width:1340px}
#menu{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
.hero{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:22px 28px;margin-bottom:16px;box-shadow:0 6px 24px #5b3fe012}
.hero small{color:var(--mu);letter-spacing:2px;font-size:11px;font-weight:700}.hero h2{margin:4px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.8px}.hero p{margin:0;color:var(--mu)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;box-shadow:0 6px 20px #5b3fe010;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-18px;top:-18px;width:72px;height:72px;border-radius:50%;background:#7c5cff14}
.card b{display:block;font-size:28px;font-weight:800;letter-spacing:-1px}.card span{color:var(--mu);font-size:12px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px #5b3fe00d}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{width:auto;min-width:130px;flex:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);cursor:pointer;user-select:none;background:#faf9ff}
tr:hover td{background:#fbfaff}td input,td select{min-width:120px}
h3{font-size:16px;font-weight:800;margin:20px 0 10px}
.tag{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700}
.Pending{background:#fdecec;color:var(--er)}.In-Progress{background:#fef3dc;color:var(--wa)}.Completed{background:#dff5ec;color:var(--ok)}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.empty{padding:34px;text-align:center;color:var(--mu)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:20}
.toast{background:#1d1a3b;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 6px 18px #0004}.toast.e{background:var(--er)}.toast.o{background:var(--ok)}
#modal{position:fixed;inset:0;background:#1d1a3b99;display:none;align-items:center;justify-content:center;z-index:15;padding:14px}
#modal>div{background:#fff;border-radius:20px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){#side{transform:translateX(-100%);transition:.2s}#side.open{transform:none}#main{margin-left:0;padding:14px}#menu{display:inline-block}.g2{grid-template-columns:1fr}.hero h2{font-size:22px}}
</style></head><body>
<div id="login"><div class="brand"><b>TechVera</b><small>IDS PORTAL</small></div>
<div id="fnw" style="display:none"><label>Full name</label><input id="fn" autocomplete="name"></div>
<label>Email</label><input id="em" type="email" autocomplete="username">
<label>Password</label><input id="pw" type="password" autocomplete="current-password">
<p id="lerr" style="color:var(--er);min-height:18px"></p><button class="btn" id="lbtn" style="width:100%">Sign in</button><p id="swm">New here? <a href="#" onclick="setMode(true);return false">Create account</a></p></div>
<div id="app"><nav id="side"></nav><main id="main"></main></div>
<div id="modal"><div id="mbody"></div></div><div id="toasts"></div>
<script>
const C=window.APP_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const R=['Wrong Pass','Already Suspend','Suspend Working','Marketplace Suspend','Name Issue','Email','1st Reach Marketplace','Confirm Identity','Other'];
let me=null,files=[],view='dash',S={page:1,sort:'created_at',dir:-1,q:'',from:'',to:'',tl:'',st:'',kind:''},RP={from:'',to:'',tl:''},RC=[],RF={q:'',reason:'',tl:'',from:'',to:''};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY_START=6,ld=d=>new Date(new Date(d).getTime()-DAY_START*3600000).toLocaleDateString('en-CA'),today=()=>ld(new Date()),fmt=d=>d?new Date(d).toLocaleString():'-',isA=()=>me.role==='admin';
const isUp=x=>!!(x.reason||(x.remarks&&String(x.remarks).trim()));const RN={admin:'Admin',team_lead:'Team Lead',member:'Member'},isTL=()=>me.role==='team_lead';
const rtxt=r=>r.reason==='Other'?'Other: '+(r.reason_other||''):(r.reason||(isUp(r)?'OK':''));
function toast(m,t='n'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),4000)}
function modal(h){$('#mbody').innerHTML=h;$('#modal').style.display='flex'}function closeM(){$('#modal').style.display='none'}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
function ask(o){return new Promise(res=>{const inp=o.input!==undefined;
 modal(`<h3 style="margin:0 0 8px;font-size:18px">${esc(o.title)}</h3><p style="color:var(--mu);margin:0 0 ${inp?10:20}px">${esc(o.msg||'')}</p>${inp?`<input id="askin" value="${esc(o.input)}" style="margin-bottom:20px">`:''}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" id="ask-no">Cancel</button><button class="btn ${o.danger?'d':''}" id="ask-ok">${esc(o.ok||'OK')}</button></div>`);
 const done=v=>{$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};closeM();res(v)};
 $('#ask-no').onclick=()=>done(null);$('#ask-ok').onclick=()=>done(inp?$('#askin').value:true);
 $('#modal').onclick=e=>{if(e.target.id==='modal')done(null)};
 if(inp){const i=$('#askin');i.focus();i.onkeydown=e=>{if(e.key==='Enter')$('#ask-ok').click()}}})}
async function copy(t,l='Copied'){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast(l,'o')}
async function csv(rows,name){if(!rows.length)return toast('Nothing to export','e');if(!(await ask({title:'Export sensitive data?',msg:'This export contains plain-text UIDs and passwords. Store the file securely.',ok:'Export'})))return;
 const H=['File Name','Team Lead','Assignment Date','Person Number','UID','Password','Reason','Response','Last Updated'];
 const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const b=new Blob(['\ufeff'+[H,...rows.map(r=>[r.file,r.tl,r.date,r.person,r.uid,r.password,r.reason,r.remarks,r.last])].map(l=>l.map(q).join(',')).join('\r\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'-'+today()+'.csv';a.click();toast('Exported '+rows.length+' rows','o')}
// ---- auth
let signup=false;
function setMode(v){signup=v;$('#fnw').style.display=v?'block':'none';$('#lbtn').textContent=v?'Create account':'Sign in';$('#pw').autocomplete=v?'new-password':'current-password';$('#lerr').textContent='';
 $('#swm').innerHTML=v?'Already have an account? <a href="#" onclick="setMode(false);return false">Sign in</a>':'New here? <a href="#" onclick="setMode(true);return false">Create account</a>'}
$('#lbtn').onclick=async()=>{const L=$('#lerr');L.style.color='var(--er)';L.textContent='';const email=$('#em').value.trim(),password=$('#pw').value;
 if(signup){const name=$('#fn').value.trim();if(!name)return L.textContent='Enter your full name';if(password.length<8)return L.textContent='Use at least 8 characters';
  $('#lbtn').disabled=true;const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});$('#lbtn').disabled=false;
  if(error)return L.textContent=error.message;if(data.session)return boot();
  setMode(false);L.style.color='var(--ok)';L.textContent='Account created. Check your email to confirm it, then sign in.';return}
 $('#lbtn').disabled=true;const{error}=await sb.auth.signInWithPassword({email,password});$('#lbtn').disabled=false;if(error)return L.textContent=error.message;boot()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lbtn').click()};
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return;
 const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(error||!data||!data.active){await sb.auth.signOut();$('#lerr').textContent='Your account is not active. Please contact your admin.';return}
 me=data;$('#login').style.display='none';$('#app').style.display='block';nav();go('dash')}
const IC={dash:'⌂',files:'☰',add:'＋',daily:'◷',reports:'◐',profile:'☺',tls:'☻',records:'▤',members:'☻',receivers:'✉'};
function nav(){const t=me.role==='member'?[['dash','Dashboard'],['files','My Files'],['profile','Profile']]:isA()?[['dash','Dashboard'],['files','All Files'],['tls','Team Leads'],['records','ID Records'],['receivers','Receivers'],['reports','Daily & Monthly Reports'],['profile','Settings']]:
 [['dash','Dashboard'],['files','My Files'],['add','Add New File'],['members','Team Members'],['daily','Daily Updates'],['reports','Reports'],['profile','Profile']];
 $('#side').innerHTML=`<div class="brand"><b>TechVera</b><small>IDS PORTAL</small></div>`+t.map(([k,l])=>`<a data-k="${k}" onclick="go('${k}')"><i>${IC[k]}</i>${l}</a>`).join('')+`<div style="flex:1"></div><div class="me">${esc(me.full_name||me.email)}<br>${RN[me.role]}</div><a onclick="logout()"><i>↩</i>Sign out</a>`}
async function fetchFiles(){const{data,error}=await sb.from('files').select('*,tl:profiles!files_team_lead_id_fkey(full_name,email),id_records(id,reason,remarks,last_updated,assigned_member_id,person_number)').eq('archived',false).order('created_at',{ascending:false});
 if(error){toast(error.message,'e');return false}
 files=data.map(f=>{const r=f.id_records||[];f.total=r.length;f.upd=r.filter(isUp).length;f.pend=f.total-f.upd;f.last=r.reduce((m,x)=>isUp(x)&&x.last_updated&&x.last_updated>m?x.last_updated:m,'');
  f.today=r.some(x=>isUp(x)&&x.last_updated&&ld(x.last_updated)===today());f.st=f.upd===0?'Pending':f.pend===0?'Completed':'In-Progress';f.tlname=f.tl?.full_name||f.tl?.email||'-';return f});return true}
async function go(v,arg){if(v==='add'&&!arg)return chooseType();view=v;curTL=null;document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.k===v));$('#side').classList.remove('open');
 const m=$('#main');m.innerHTML='<div class="empty">Loading…</div>';
 if(v==='profile')return pProfile();if(v==='add'){if(arg==='portal')return pAddPortal();await fetchFiles();return pAdd()}
 if(v==='records')return pRecords();
 if(!(await fetchFiles()))return m.innerHTML='<div class="empty">Could not load data.</div>';
 ({dash:pDash,files:()=>pFiles('files'),daily:()=>pFiles('daily'),reports:pReports,tls:pTLs,members:pMembers,receivers:pReceivers})[v]()}
const hdr=(t,x='')=>`<div class="top"><div><button class="btn s" id="menu" onclick="$('#side').classList.toggle('open')">☰</button> <h1 style="display:inline">${t}</h1></div><div>${x}</div></div>`;
// ---- dashboard
let DF={user:'',range:'today'},PPL=[];
const R2=[['today','Today'],['yesterday','Yesterday'],['week','Last 7 Days'],['month','This Month'],['all','All Time']];
const RX1=/(\d+)\s*(?:responses?|resp|replies|reply)\b/i,RX2=/(?:responses?|resp)\s*[:=-]?\s*(\d+)/i;
const noLead=t=>String(t||'').replace(/(\d+)\s*leads?\b|\bleads?\s*[:=-]?\s*(\d+)/gi,' ');
const respN=r=>{const t=noLead(r.remarks),m=t.match(RX1)||t.match(RX2);if(m)return parseInt(m[1],10);const a=t.match(/\d+/g)||[];return a.length===1?parseInt(a[0],10):0};
const respUnclear=r=>{const t=noLead(r.remarks);return !(RX1.test(t)||RX2.test(t))&&(t.match(/\d+/g)||[]).length>1};
const dRange=k=>{const T=today(),[y,m,d]=T.split('-').map(Number),add=n=>new Date(y,m-1,d+n).toLocaleDateString('en-CA');
 return k==='today'?[T,T]:k==='yesterday'?[add(-1),add(-1)]:k==='week'?[add(-6),T]:k==='month'?[T.slice(0,7)+'-01',T.slice(0,7)+'-31']:['0000-00-00','9999-99-99']};
async function pDash(){
 if(me.role!=='member'){const{data}=await sb.from('profiles').select('id,full_name,email,role').neq('role','admin');PPL=(data||[]).filter(p=>p.id!==me.id)}else PPL=[];
 const hh=new Date().getHours(),nm=p=>p.full_name||p.email,tls=PPL.filter(p=>p.role==='team_lead'),ms=PPL.filter(p=>p.role==='member');
 const hero=`<div class="hero"><small>WORKSPACE OVERVIEW</small><h2>${hh<12?'Good morning':hh<18?'Good afternoon':'Good evening'}, ${esc(me.full_name||me.email.split('@')[0])} 👋</h2><p>${isA()?'Everything across all Team Leads at a glance.':'Your files and daily updates at a glance.'} Work day: <b>${today()}</b> (changes at ${DAY_START}:00 AM)</p></div>`;
 const opt=a=>a.map(p=>`<option value="${p.id}" ${DF.user===p.id?'selected':''}>${esc(nm(p))}</option>`).join('');
 const uf=me.role==='member'?'':`<div><label>User</label><select id="duser"><option value="">All Users</option>${isA()?`<optgroup label="Team Leads">${opt(tls)}</optgroup>`:''}<optgroup label="Members">${opt(ms)}</optgroup></select></div>`;
 $('#main').innerHTML=hdr('Dashboard',isTL()?'<button class="btn" onclick="go(\'add\')">+ Add New File</button>':'')+hero+
 `<div class="panel"><div class="bar" style="align-items:flex-end">${uf}<div><label>Date Filter</label><select id="drange">${R2.map(([k,l])=>`<option value="${k}" ${DF.range===k?'selected':''}>${l}</option>`).join('')}</select></div><button class="btn" style="flex:0 0 auto;min-width:0" onclick="applyDF()">Apply Filter</button></div></div>
 <div id="dstats"></div><h3>Recently updated files</h3><div class="panel"><div class="tw">${ftable([...files].filter(f=>f.last).sort((a,b)=>b.last.localeCompare(a.last)).slice(0,5))}</div></div>`;
 dstats()}
function applyDF(){DF.user=$('#duser')?$('#duser').value:'';DF.range=$('#drange').value;dstats()}
function dstats(){const[a,b]=dRange(DF.range),inR=d=>d>=a&&d<=b,sel=PPL.find(p=>p.id===DF.user),nm=p=>p.full_name||p.email;
 let recs=files.flatMap(f=>f.id_records.map(r=>({f,r})));
 if(sel)recs=sel.role==='member'?recs.filter(x=>x.r.assigned_member_id===sel.id):recs.filter(x=>x.f.team_lead_id===sel.id);
 const asg=recs.filter(x=>inR(x.f.assignment_date)),upd=recs.filter(x=>isUp(x.r)&&x.r.last_updated&&inR(ld(x.r.last_updated))),dist=l=>new Set(l.map(x=>x.f.id)).size;
 const by={};R.forEach(r=>by[r]=0);let ok=0;upd.forEach(x=>{x.r.reason?by[x.r.reason]=(by[x.r.reason]||0)+1:ok++});
 const resp=upd.filter(x=>respN(x.r)>0),rd={};resp.forEach(x=>{const d=ld(x.r.last_updated),o=rd[d]||(rd[d]={ids:0,n:0});o.ids++;o.n+=respN(x.r)});
 const c=[...(isA()?[[PPL.filter(p=>p.role==='team_lead').length,'Total Team Leads']]:[]),[dist(asg),'Files Assigned'],[asg.length,'IDs Assigned'],[dist(upd),'Files Updated'],[upd.length,'IDs Updated'],[asg.filter(x=>!isUp(x.r)).length,'IDs Pending']];
 const lab=R2.find(x=>x[0]===DF.range)[1];
 const dl2=upd.filter(x=>String(x.r.remarks||'').trim()&&(respN(x.r)>0||respUnclear(x.r))).slice(0,150),unc=upd.filter(x=>respUnclear(x.r)).length;
 const det=dl2.length?`${unc?`<p style="color:var(--wa);margin:8px 0 0">⚠ ${unc} ID(s) have several numbers in Response and were not counted. Check them below.</p>`:''}<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">See how each response was counted</summary><div class="tw"><table><tr><th>File</th><th>Response text</th><th>Counted</th></tr>${dl2.map(x=>`<tr><td>${esc(x.f.file_name)}${x.f.kind==='portal'?'':' Person '+x.r.person_number}</td><td>${esc(x.r.remarks)}</td><td>${respUnclear(x.r)?'⚠ not counted':respN(x.r)}</td></tr>`).join('')}</table></div></details>`:'';
 $('#dstats').innerHTML=`<p style="color:var(--mu);margin:0 0 10px">Showing: <b>${lab}</b>${sel?' · '+esc(nm(sel)):''}${DF.range==='all'?'':' ('+(a===b?a:(DF.range==='month'?a.slice(0,7):a+' to '+b))+')'}</p>
 <div class="cards">${c.map(([n,l])=>`<div class="card"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
 <div class="panel"><b>IDs by status</b> <span style="color:var(--mu)">(IDs updated in this period)</span><div class="cards" style="margin:10px 0 0">${Object.entries(by).map(([k,v])=>`<div class="card"><b>${v}</b><span>${k}</span></div>`).join('')}<div class="card"><b>${ok}</b><span>OK (no issue)</span></div></div></div>
 <div class="panel"><b>Responses</b><div class="cards" style="margin:10px 0">${[[resp.reduce((t,x)=>t+respN(x.r),0),'Total responses'],[resp.length,'IDs with response']].map(([n,l])=>`<div class="card"><b>${n}</b><span>${l}</span></div>`).join('')}</div><div class="tw"><table><tr><th>Date</th><th>IDs with response</th><th>Total responses</th></tr>${Object.entries(rd).sort().reverse().slice(0,10).map(([k,v])=>`<tr><td>${k}</td><td>${v.ids}</td><td>${v.n}</td></tr>`).join('')||'<tr><td colspan=3>No responses in this period</td></tr>'}</table></div>${det}</div>`}
// ---- files
function ftable(list){if(!list.length)return'<div class="empty">No files found.</div>';

 <td><button class="btn s sm" onclick="cp('${r.id}','uid')">UID</button> <button class="btn s sm" onclick="cp('${r.id}','password')">Pass</button> <button class="btn s sm" onclick="cp('${r.id}','rec')">Record</button> <button class="btn s sm" onclick="hist('${r.id}')">History</button></td></tr>`).join('')+
 `</table></div>${edit?`<p><button class="btn" id="ssave" onclick="saveRows('${id}')">Save Updates</button></p>`:''}</div>`}
const line=r=>[...(window._f&&window._f.kind==='portal'?[]:[`Person ${r.person_number}`]),r.uid||'',r.password||'',rtxt(r),r.remarks||''].map(x=>String(x).replace(/[\t\r\n]+/g,' ')).join('\t');
function cp(id,k){const r=_rs.find(x=>x.id===id),row=document.querySelector(`tr[data-id="${id}"]`);
 const cur={...r,uid:row.querySelector('.u').value,password:row.querySelector('.p').value};
 if(k==='rec')return copy(line(cur),'Record copied');copy(cur[k]||'',k==='uid'?'UID copied':'Password copied')}
function copyAll(){copy([(_f.kind==='portal'?'':'Person\t')+'UID\tPassword\tReason\tResponse',..._rs.map(line)].join('\n'),'All records copied')}
const fileRows=()=>_rs.map(r=>({file:_f.file_name,tl:_tl,date:_f.assignment_date,person:_f.kind==='portal'?'':r.person_number,uid:r.uid,password:r.password,reason:rtxt(r),remarks:r.remarks,last:fmt(r.last_updated)}));
async function saveRows(fid){const ch=[];
 for(const tr of document.querySelectorAll('tr[data-id]')){const o=_rs.find(x=>x.id===tr.dataset.id),n={uid:tr.querySelector('.u').value.trim()||null,password:tr.querySelector('.p').value||null,reason:tr.querySelector('.r').value||null,reason_other:null,remarks:tr.querySelector('.m').value.trim()||null};
  if(n.reason==='Other'){n.reason_other=tr.querySelector('.o').value.trim();if(!n.reason_other)return toast(`Row ${o.person_number}: enter the custom reason`,'e')}
  if(n.uid!==(o.uid||null)||n.password!==(o.password||null)||n.reason!==(o.reason||null)||n.reason_other!==(o.reason_other||null)||n.remarks!==(o.remarks||null))ch.push({id:o.id,n,p:o.person_number})}
 if(!ch.length)return toast('No changes to save');$('#ssave').disabled=true;
 const res=await Promise.all(ch.map(c=>sb.from('id_records').update(c.n).eq('id',c.id).select('id')));$('#ssave').disabled=false;
 const bad=res.map((r,i)=>r.error||!r.data?.length?ch[i].p:null).filter(Boolean);
 if(bad.length)toast(`Save failed for row ${bad.join(', ')}. Other changes may have saved; reload to check.`,'e');else{const left=[...document.querySelectorAll('tr[data-id]')].filter(tr=>!tr.querySelector('.r').value&&!tr.querySelector('.m').value.trim()).length;toast(left?`Saved. ${left} ID(s) still need a reason or response.`:'Saved. File complete ✓','o')}
 openFile(fid,true)}
async function hist(id){const{data,error}=await sb.from('id_update_history').select('*,u:profiles(full_name,email)').eq('id_record_id',id).order('updated_at',{ascending:false});
 if(error)return toast(error.message,'e');
 modal(`<h3 style="margin-top:0">Update history</h3>${data.length?data.map(h=>`<div class="panel"><b>${fmt(h.updated_at)}</b> by ${esc(h.u?.full_name||h.u?.email||'?')}<br><small>Before:</small> ${esc(JSON.stringify(h.previous_values))}<br><small>After:</small> ${esc(JSON.stringify(h.new_values))}</div>`).join(''):'<div class="empty">No updates yet.</div>'}<button class="btn s" onclick="closeM()">Close</button>`)}

async function pRecords(){const m=$('#main');let all=[],from=0;
 for(;;){const{data,error}=await sb.from('id_records').select('*,f:files!inner(file_name,assignment_date,archived,tl:profiles!files_team_lead_id_fkey(full_name,email))').eq('f.archived',false).order('file_id').order('person_number').range(from,from+999);
  if(error)return m.innerHTML=`<div class="empty">${esc(error.message)}</div>`;all=all.concat(data);if(data.length<1000)break;from+=1000}
 RC=all.map(r=>({file:r.f.file_name,tl:r.f.tl?.full_name||r.f.tl?.email||'-',date:r.f.assignment_date,person:r.person_number,uid:r.uid||'',password:r.password||'',reason:rtxt(r),rk:r.reason||'',remarks:r.remarks||'',last:fmt(r.last_updated),ld:r.last_updated,up:isUp(r)}));
 const tls=[...new Set(RC.map(r=>r.tl))].sort();
 m.innerHTML=hdr('ID Records','<button class="btn s" onclick="csv(RV(),\'records\')">Export filtered CSV</button>')+`<div class="panel"><div class="bar"><input placeholder="Search file name or UID" oninput="RF.q=this.value;rdraw()">
 ${isA()?`<select onchange="RF.tl=this.value;rdraw()"><option value="">All Team Leads</option>${tls.map(t=>`<option>${esc(t)}</option>`).join('')}</select>`:''}
 <select onchange="RF.reason=this.value;rdraw()"><option value="">All reasons</option><option value="_ok">OK (no issue)</option><option value="_none">Not updated</option>${R.map(x=>`<option>${x}</option>`).join('')}</select>
 <input type="date" onchange="RF.from=this.value;rdraw()"><input type="date" onchange="RF.to=this.value;rdraw()"></div><div class="tw" id="rt"></div></div>`;RF={q:'',reason:'',tl:'',from:'',to:''};rdraw()}
const RV=()=>{const q=RF.q.toLowerCase();return RC.filter(r=>(!q||r.file.toLowerCase().includes(q)||r.uid.toLowerCase().includes(q))&&(!RF.tl||r.tl===RF.tl)&&(!RF.reason||(RF.reason==='_none'?!r.up:RF.reason==='_ok'?(r.up&&!r.rk):r.rk===RF.reason))&&(!RF.from||r.date>=RF.from)&&(!RF.to||r.date<=RF.to))};
function rdraw(){const l=RV(),s=l.slice(0,300);$('#rt').innerHTML=l.length?`<table><tr><th>File</th>${isA()?'<th>Team Lead</th>':''}<th>Date</th><th>Person</th><th>UID</th><th>Password</th><th>Reason</th><th>Response</th><th>Last Updated</th><th>Copy</th></tr>${s.map((r,i)=>`<tr><td>${esc(r.file)}</td>${isA()?`<td>${esc(r.tl)}</td>`:''}<td>${r.date}</td><td>${r.person}</td><td>${esc(r.uid)}</td><td>${esc(r.password)}</td><td>${esc(r.reason)}</td><td>${esc(r.remarks)}</td><td>${r.last}</td>
 <td><button class="btn s sm" onclick="copy(RV()[${i}].uid,'UID copied')">UID</button> <button class="btn s sm" onclick="copy(RV()[${i}].password,'Password copied')">Pass</button></td></tr>`).join('')}</table>${l.length>300?`<p style="color:var(--mu)">Showing first 300 of ${l.length}. Use filters or export.</p>`:`<p style="color:var(--mu)">${l.length} records</p>`}`:'<div class="empty">No records match.</div>'}
// ---- reports
function pReports(){const tls=[...new Set(files.map(f=>f.tlname))].sort();
 $('#main').innerHTML=hdr(isA()?'Daily & Monthly Reports':'Reports')+`<div class="panel"><div class="bar">${isA()?`<select onchange="RP.tl=this.value;rep()"><option value="">All Team Leads</option>${tls.map(t=>`<option ${RP.tl===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`:''}
 <input type="date" value="${RP.from}" onchange="RP.from=this.value;rep()"><input type="date" value="${RP.to}" onchange="RP.to=this.value;rep()"></div></div><div id="rep"></div>`;rep()}
function rep(){const fl=files.filter(f=>(!RP.tl||f.tlname===RP.tl)&&(!RP.from||f.assignment_date>=RP.from)&&(!RP.to||f.assignment_date<=RP.to));
 const tb=(h,rows)=>`<div class="panel tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">No data</td></tr>`}</table></div>`;
 const grp=(arr,kf)=>{const o={};arr.forEach(x=>{const k=kf(x);(o[k]=o[k]||[]).push(x)});return Object.entries(o).sort().reverse()};
 const recs=fl.flatMap(f=>f.id_records),upd=recs.filter(r=>isUp(r)&&r.last_updated&&(!RP.from||ld(r.last_updated)>=RP.from)&&(!RP.to||ld(r.last_updated)<=RP.to));
 const by={};R.forEach(r=>by[r]=0);recs.forEach(r=>r.reason&&(by[r.reason]=(by[r.reason]||0)+1));by['OK (no issue)']=recs.filter(r=>isUp(r)&&!r.reason).length;
 $('#rep').innerHTML=`<div class="cards"><div class="card"><b>${fl.length}</b><span>Files</span></div><div class="card"><b>${recs.length}</b><span>IDs</span></div><div class="card"><b>${recs.filter(isUp).length}</b><span>IDs updated</span></div><div class="card"><b>${recs.filter(r=>!isUp(r)).length}</b><span>IDs pending</span></div></div>
 <h3>Files assigned per date</h3>${tb(['Date','Files','IDs'],grp(fl,f=>f.assignment_date).map(([k,v])=>[k,v.length,v.reduce((s,f)=>s+f.total,0)]))}
 <h3>IDs by Team Lead</h3>${tb(['Team Lead','Files','IDs','Updated','Pending'],grp(fl,f=>f.tlname).reverse().map(([k,v])=>[k,v.length,v.reduce((s,f)=>s+f.total,0),v.reduce((s,f)=>s+f.upd,0),v.reduce((s,f)=>s+f.pend,0)]))}
 <h3>Reason breakdown</h3>${tb(['Reason','IDs'],Object.entries(by))}
 <h3>Daily activity (IDs updated)</h3>${tb(['Date','IDs updated'],grp(upd,r=>ld(r.last_updated)).map(([k,v])=>[k,v.length]))}
 <h3>Monthly summary</h3>${tb(['Month','Files assigned','IDs assigned','IDs updated'],[...new Set([...fl.map(f=>f.assignment_date.slice(0,7)),...upd.map(r=>ld(r.last_updated).slice(0,7))])].sort().reverse().map(k=>[k,fl.filter(f=>f.assignment_date.startsWith(k)).length,fl.filter(f=>f.assignment_date.startsWith(k)).reduce((s,f)=>s+f.total,0),upd.filter(r=>ld(r.last_updated).startsWith(k)).length]))}`}
// ---- team leads / profile
let TLP=[],curTL=null;
async function pTLs(){const{data,error}=await sb.from('profiles').select('*').order('created_at');if(error)return toast(error.message,'e');
 $('#main').innerHTML=(TLP=data,hdr('Team Leads'))+`<div class="panel tw"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Files</th><th>IDs</th><th>Active</th><th></th></tr>${data.map(p=>{const fl=files.filter(f=>f.team_lead_id===p.id);
 return`<tr style="cursor:pointer" onclick="tlFiles('${p.id}')"><td>${esc(p.full_name)||'-'}</td><td>${esc(p.email)}</td><td>${p.role}</td><td>${fl.length}</td><td>${fl.reduce((s,f)=>s+f.total,0)}</td><td>${p.active?'Yes':'No'}</td><td><button class="btn sm" onclick="event.stopPropagation();tlFiles('${p.id}')">View Files</button> ${p.id===me.id?'':`<button class="btn s sm" onclick="event.stopPropagation();setActive('${p.id}',${!p.active})">${p.active?'Deactivate':'Activate'}</button> <button class="btn s sm" onclick="event.stopPropagation();rename('${p.id}','${esc(p.full_name).replace(/'/g,'')}')">Rename</button>`}</td></tr>`}).join('')}</table></div>
 <p style="color:var(--mu)">Click a Team Lead to see their files. New Team Leads are created in Supabase Authentication > Users (see README), then appear here.</p>`}
async function tlFiles(id){const p=TLP.find(x=>x.id===id);if(!p)return;const nm=p.full_name||p.email;curTL=id;view='files';
 document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.k==='tls'));$('#main').innerHTML='<div class="empty">Loading…</div>';
 if(!(await fetchFiles()))return;S={...S,q:'',st:'',from:'',to:'',tl:nm,page:1};pFiles('files');
 $('.top h1').textContent='Files of '+nm;$('.top>div:last-child').innerHTML='<button class="btn s" onclick="go(\'tls\')">← Team Leads</button>'}
let pickM=null,pickA=[],MEM=[];
async function loadMembers(){const{data,error}=await sb.from('profiles').select('*').eq('role','member').order('full_name');if(error){toast(error.message,'e');return false}MEM=data;return true}
async function pMembers(){if(!(await loadMembers()))return;
 const row=m=>{const rs=files.flatMap(f=>f.id_records.filter(r=>r.assigned_member_id===m.id)),nf=files.filter(f=>f.id_records.some(r=>r.assigned_member_id===m.id)).length;return`<tr><td>${esc(m.full_name)||'-'}</td><td>${esc(m.email)}</td><td>${nf}</td><td>${rs.length}</td><td>${rs.filter(isUp).length}</td><td>${m.active?'Yes':'No'}</td><td><button class="btn s sm" onclick="setMember('${m.id}',${!m.active})">${m.active?'Deactivate':'Activate'}</button></td></tr>`};
 $('#main').innerHTML=hdr('Team Members','<button class="btn" onclick="newMember()">+ Create user</button>')+(MEM.length?`<div class="panel tw"><table><tr><th>Name</th><th>Email</th><th>Files</th><th>IDs</th><th>IDs updated</th><th>Active</th><th></th></tr>${MEM.map(row).join('')}</table></div>`:`<div class="panel empty"><p>No team members yet.</p><button class="btn" onclick="newMember()">+ Create user</button></div>`)}
async function setMember(id,v){if(!(await ask({title:v?'Activate member?':'Deactivate member?',msg:v?'They can log in again.':'They will lose access immediately.',ok:v?'Activate':'Deactivate',danger:!v})))return;
 const{data,error}=await sb.from('profiles').update({active:v}).eq('id',id).select();if(error||!data?.length)return toast(error?.message||'Failed','e');toast('Updated','o');pMembers()}
function newMember(){modal(`<h3 style="margin:0 0 4px;font-size:18px">Create user</h3><p style="color:var(--mu);margin:0 0 6px">This person will log in to see and update the files you assign.</p><label>Full name</label><input id="mn"><label>Email</label><input id="mm" type="email"><label>Password (min 8 characters)</label><input id="mp"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="btn s" onclick="closeM()">Cancel</button><button class="btn" id="mbtn" onclick="saveMember()">Create user</button></div>`)}
async function saveMember(){const name=$('#mn').value.trim(),email=$('#mm').value.trim(),password=$('#mp').value;
 if(!name||!email)return toast('Enter name and email','e');if(password.length<8)return toast('Password must be at least 8 characters','e');
 $('#mbtn').disabled=true;
 try{const{data:{session}}=await sb.auth.getSession();
  const r=await fetch('/api/create-member',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({name,email,password})});
  const j=await r.json().catch(()=>({}));
  if(r.status===404){$('#mbtn').disabled=false;return toast('Member service is not set up yet. Add api/create-member.js to the project.','e')}
  if(!r.ok){$('#mbtn').disabled=false;return toast(j.error||'Could not create user','e')}
  window._ci='TechVera IDs Portal\nLink: '+location.origin+'\nEmail: '+email+'\nPassword: '+password;
  modal(`<h3 style="margin:0 0 6px;font-size:18px">User created ✓</h3><p style="color:var(--mu);margin:0 0 10px">Give these login details to ${esc(name)}:</p><div class="panel" style="white-space:pre-wrap;word-break:break-all">${esc(window._ci)}</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" onclick="closeM()">Close</button><button class="btn" onclick="copy(window._ci,'Login details copied')">Copy details</button></div>`);
  pMembers()
 }catch(e){$('#mbtn').disabled=false;toast('Network error: '+e.message,'e')}}
async function pickMember(){const tot=parseInt($('#a5').value,10);if(!(tot>=1&&tot<=500))return toast('Enter Total Number of IDs first','e');
 if(!(await loadMembers()))return;const ms=MEM.filter(m=>m.active);window._pt=tot;
 modal(`<h3 style="margin:0 0 4px;font-size:18px">Assign ${tot} IDs</h3><p style="color:var(--mu);margin:0 0 10px">Tick one or more members. The IDs are split evenly and you can change each number.</p>${ms.length?ms.map(m=>{const a=pickA.find(x=>x.member===m.id);return`<div class="panel" style="display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px"><input type="checkbox" class="mc" data-id="${m.id}" style="width:auto" ${a?'checked':''} onchange="splitM()"><div style="flex:1"><b>${esc(m.full_name||m.email)}</b><br><small style="color:var(--mu)">${esc(m.email)}</small></div><input type="number" min="0" class="mq" data-id="${m.id}" value="${a?a.count:''}" style="width:80px" oninput="sumM()"></div>`}).join(''):'<div class="empty">No members yet. Create a user first.</div>'}<p id="msum" style="font-weight:700;margin:6px 0 14px"></p><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn s" onclick="closeM()">Cancel</button><button class="btn s" onclick="closeM();go('members')">+ Create user</button><button class="btn" id="mdone" onclick="doneM()">Done</button></div>`);sumM()}
function splitM(){const cs=[...document.querySelectorAll('.mc')].filter(c=>c.checked),n=cs.length,t=window._pt;
 document.querySelectorAll('.mq').forEach(q=>q.value='');
 cs.forEach((c,i)=>{document.querySelector(`.mq[data-id="${c.dataset.id}"]`).value=Math.floor(t/n)+(i<t%n?1:0)});sumM()}
function sumM(){let s=0,k=0;document.querySelectorAll('.mc').forEach(c=>{if(c.checked){k++;s+=parseInt(document.querySelector(`.mq[data-id="${c.dataset.id}"]`).value,10)||0}});
 const e=$('#msum'),ok=k>0&&s===window._pt;if(e){e.textContent=`Assigned ${s} of ${window._pt}`;e.style.color=ok?'var(--ok)':'var(--er)'}if($('#mdone'))$('#mdone').disabled=!ok}
function doneM(){const a=[];document.querySelectorAll('.mc').forEach(c=>{if(c.checked){const m=MEM.find(x=>x.id===c.dataset.id),n=parseInt(document.querySelector(`.mq[data-id="${c.dataset.id}"]`).value,10)||0;if(n>0)a.push({member:m.id,count:n,name:m.full_name||m.email})}});
 if(!a.length||a.reduce((t,x)=>t+x.count,0)!==window._pt)return toast('Assigned IDs must add up to the total','e');
 pickA=a;$('#a3').value=a.length>1?a.map(x=>`${x.name} (${x.count})`).join(', '):a[0].name;closeM()}
async function setActive(id,v){if(!(await ask({title:v?'Activate user?':'Deactivate user?',msg:v?'They will be able to log in again.':'They will lose access immediately.',ok:v?'Activate':'Deactivate',danger:!v})))return;const{data,error}=await sb.from('profiles').update({active:v}).eq('id',id).select();if(error||!data?.length)return toast(error?.message||'Failed','e');toast('Updated','o');pTLs()}
async function rename(id,n){const v=await ask({title:'Rename Team Lead',msg:'Full name',input:n,ok:'Save'});if(v===null)return;const{data,error}=await sb.from('profiles').update({full_name:v.trim()}).eq('id',id).select();if(error||!data?.length)return toast(error?.message||'Failed','e');toast('Updated','o');pTLs()}
function pProfile(){$('#main').innerHTML=hdr(isA()?'Settings':'Profile')+`<div class="panel" style="max-width:420px"><p><b>${esc(me.full_name||'-')}</b><br>${esc(me.email)}<br>Role: ${RN[me.role]}</p>
 <label>New password</label><input id="np" type="password" autocomplete="new-password"><p><button class="btn" onclick="chpw()">Change password</button></p></div>`}
async function chpw(){const p=$('#np').value;if(p.length<8)return toast('Use at least 8 characters','e');const{error}=await sb.auth.updateUser({password:p});if(error)return toast(error.message,'e');$('#np').value='';toast('Password changed','o')}
boot();
